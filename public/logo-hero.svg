<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- juju's studio hero mark: the flourish j.
       High-contrast fashion-serif lowercase j with a single continuous
       hairline that starts tangent at the tail tip, closes the lower
       loop, crosses behind the stem, curls into the upper loop, and
       lands tangent on the teardrop's apex. For use at large sizes
       (covers, social cards, case-study headers). The nav chip and
       favicon use a heavier flourish-free sibling -- see
       app/components/Logo.tsx and app/icon.svg. For reversed use on
       forest, swap #3B5D4A for #DDE3D3. -->
